<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Lead — a tweak for Telegram on iOS">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#17171c"/></linearGradient>
<linearGradient id="logo" x1="0.3" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#f4f4f5"/><stop offset="1" stop-color="#5c5c63"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#8e8e9a" stop-opacity="0.55"/><stop offset="1" stop-color="#8e8e9a" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="-100" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/><animate attributeName="x1" values="-300;1300" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="-100;1500" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="run" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/><animate attributeName="x1" values="-400;1280" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1680" dur="4s" repeatCount="indefinite"/></linearGradient>
<clipPath id="round"><rect width="1280" height="400" rx="28"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1280" height="400" fill="url(#bg)"/>
<rect width="1280" height="400" fill="url(#grid)"/>
<circle cx="240" cy="200" r="190" fill="url(#glow)"><animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/></circle>
<g transform="translate(150,108) scale(0.27)"><path d="M0,52 C0,8 54,-12 87,16 L648,576 C700,628 664,682 605,682 L155,682 C69,682 0,612 0,527 Z" fill="url(#logo)"><animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="6s" repeatCount="indefinite"/></path></g>
<text x="410" y="190" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#shine)">Lead</text>
<text x="414" y="236" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#a1a1aa">The quiet power tweak for Telegram on iOS</text>
<g><rect x="414" y="270" width="129" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="478" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#d4d4d8">👻 Ghost Mode</text></g>
<g><rect x="552.85" y="270" width="136" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="621" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#d4d4d8">🗑 Anti-Revoke</text></g>
<g><rect x="698.75" y="270" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="774" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#d4d4d8">✏️ Edit History</text></g>
<g><rect x="859.05" y="270" width="175" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="947" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#d4d4d8">🔓 Protected Content</text></g>
<g><rect x="1044.25" y="270" width="98" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="1093" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#d4d4d8">📖 Stories</text></g>
<rect x="0" y="397" width="1280" height="3" fill="url(#run)"/>
</g>
</svg>