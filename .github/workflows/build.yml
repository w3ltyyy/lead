# Checks that the tweak builds, and lets anyone with a fork get the packages from the
# run's artifacts. Publishing a release is tools/release.sh, run locally.
name: Build

permissions:
    contents: read

on:
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Theos
              uses: waruhachi/theos-action@v2.4.6
              with:
                theos-src: 'waruhachi/theos'
                theos-branch: 'main'
                sdks-src: 'waruhachi/sdks'
                sdks-branch: 'main'

            - name: Build packages
              shell: bash
              run: make clean package FINALPACKAGE=1

            - name: Upload packages
              uses: actions/upload-artifact@v4
              with:
                name: lead-packages
                path: |
                    packages/*.deb
                    packages/Lead.dylib
